<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Reserva tu espacio en el parqueadero: disponibilidad y precio por tipo de vehículo en tiempo real. Operación: entrada, cobro, mensualidades y turnos de caja.">
  <meta name="theme-color" content="#0B0D10">
  <!-- Link previews (WhatsApp, Telegram, X). Replace the absolute URLs with
       your domain when the site moves behind HTTPS. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Parqueadero DevPaul">
  <meta property="og:title" content="Parqueadero DevPaul · Reserva tu espacio">
  <meta property="og:description" content="Mira la disponibilidad real por tipo de vehículo, el precio por hora y reserva en segundos.">
  <meta property="og:url" content="http://192.168.0.17:8080/reserve">
  <meta property="og:image" content="http://192.168.0.17:8080/icons/Icon-512.png">
  <meta property="og:locale" content="es_CO">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Parqueadero DevPaul · Reserva tu espacio">
  <meta name="twitter:description" content="Disponibilidad real, precio por hora y reserva en segundos.">
  <meta name="twitter:image" content="http://192.168.0.17:8080/icons/Icon-512.png">
  <meta name="color-scheme" content="dark light">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Parqueadero DevPaul">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Parqueadero DevPaul · Reserva tu espacio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { height: 100%; margin: 0; background: #0B0D10; }
    #splash {
      position: fixed; inset: 0; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
      background: #0B0D10; transition: opacity .3s ease-out;
    }
    #splash img { width: 120px; height: 120px; border-radius: 24px; }
    #splash p {
      margin: 0; color: #E5E7EB; font-size: 14px; letter-spacing: .4px;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    #splash.splash-hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <!-- Branded first paint: Flutter removes it on its first frame. -->
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <p>Parqueadero DevPaul</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('splash-hidden');
      setTimeout(function () { splash.remove(); }, 350);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
