# Static host for the public evidence page (Flutter web, path URL strategy).
# `/evidence?session=..&plate=..` must fall back to index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Production hygiene: compression + baseline browser hardening.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx replaces inherited add_header directives inside a location, so the
    # security headers are repeated here to keep them on static assets too.
    location ~* \.(js|wasm|json|png|jpg|jpeg|svg|ico)$ {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }
}
