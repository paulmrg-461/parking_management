services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: parking
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/parking
      SECRET_KEY: ${SECRET_KEY:-REPLACE_WITH_A_RANDOM_32+_BYTE_SECRET}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      EVIDENCE_STORAGE_PATH: /app/data/evidence
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - evidence_data:/app/data/evidence
    ports:
      - "8000:8000"

volumes:
  db_data:
  evidence_data:
