# Full local stack:
#   - self-hosted Supabase (Postgres, Auth, REST, Storage, Studio, ...)
#   - FastAPI backend (transitional: still owns billing/check-in/check-out)
#   - Redis (cache + login limiter)
#
# Supabase is the target source of truth. During the migration it runs at
# http://localhost:${API_GW_HTTP_PORT:-8001} while the app keeps calling
# FastAPI on :8000. The API gateway moves to :8000 once FastAPI is removed.
include:
  - path: supabase/docker-compose.yml

services:
  redis:
    image: redis:7-alpine
    # Cache + login-attempt limiter only (safe to lose): no persistence.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb",
              "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # No published ports: reachable only on the compose network.

  # Applies supabase/migrations/*.sql in order, exactly once per file.
  supabase-migrate:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      # GoTrue creates the `auth` schema (and auth.users) on first boot; the
      # profile trigger can only be created after that.
      auth:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-parking}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./supabase/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]

  backend:
    build: ./backend
    depends_on:
      supabase-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-parking}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required (see .env.example)}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      # Accept Supabase Auth tokens during the migration (legacy PIN tokens
      # keep working until the Flutter client fully moves to GoTrue).
      SUPABASE_JWT_SECRET: ${JWT_SECRET:-}
      # Schema is owned by supabase/migrations; skip Alembic in this stack.
      SCHEMA_MANAGED_EXTERNALLY: "1"
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/Bogota}
      EVIDENCE_STORAGE_PATH: /app/data/evidence
      EVIDENCE_MAX_BYTES: ${EVIDENCE_MAX_BYTES:-5242880}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Shared cache + login limiter. Empty REDIS_URL = in-process fallback.
      REDIS_URL: ${REDIS_URL-redis://redis:6379/0}
    volumes:
      - evidence_data:/app/data/evidence
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  evidence_data:
